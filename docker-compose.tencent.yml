# Tencent cloud override — no public DB/Redis, no LAN proxy, optional celery profile.
services:
  postgres:
    ports: []
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    ports: []
    deploy:
      resources:
        limits:
          memory: 128m

  backend:
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
    deploy:
      resources:
        limits:
          memory: 1536m

  frontend:
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 384m

  celery_worker:
    profiles:
      - celery
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
