name: Test

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["develop"]

jobs:
  test-backend:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: poe2li
          POSTGRES_PASSWORD: poe2li_secret
          POSTGRES_DB: poe2li
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poe2li -d poe2li"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
          pip install pytest pytest-cov

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://poe2li:poe2li_secret@127.0.0.1:5432/poe2li
          REDIS_URL: redis://127.0.0.1:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/1
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
          LLM_BASE_URL: https://api.siliconflow.cn/v1
          LLM_MODEL: deepseek-ai/DeepSeek-V4-Flash
          LLM_API_KEY: ${{ secrets.SILICONFLOW_API_KEY || 'test-key' }}
          EMBEDDING_PROVIDER: api
          EMBEDDING_BASE_URL: https://api.siliconflow.cn/v1
          EMBEDDING_API_KEY: ${{ secrets.SILICONFLOW_API_KEY || 'test-key' }}
          EMBEDDING_API_MODEL: BAAI/bge-m3
          EMBEDDING_DIM: "1024"
        run: pytest --cov=app --cov-report=xml

  test-frontend:
    name: Frontend Tests (jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run jest
        run: npm test -- --coverage
