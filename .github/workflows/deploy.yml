name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deployment dependencies
        run: |
          python -m pip install --upgrade pip
          pip install paramiko

      - name: Deploy to NAS (dev)
        if: github.event.inputs.environment != 'staging' && github.event.inputs.environment != 'prod'
        env:
          NAS_HOST: ${{ vars.NAS_HOST || '192.168.110.26' }}
          NAS_PORT: ${{ vars.NAS_PORT || '2212' }}
          NAS_USER: ${{ vars.NAS_USER || 'skc' }}
          NAS_PASS: ${{ secrets.NAS_PASS }}
          NAS_GIT_REF: ${{ github.ref_name }}
        run: |
          python deploy_nas.py

      - name: Deploy to Tencent Cloud (staging/prod)
        if: github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'prod'
        env:
          TENCENT_HOST: ${{ vars.TENCENT_HOST }}
          TENCENT_PORT: ${{ vars.TENCENT_PORT || '22' }}
          TENCENT_USER: ${{ vars.TENCENT_USER || 'root' }}
          TENCENT_SSH_PASS: ${{ secrets.TENCENT_SSH_PASS }}
          TENCENT_ROOT: ${{ vars.TENCENT_ROOT || '/opt/PoE2LI' }}
          TENCENT_BRANCH: ${{ github.ref_name }}
          NAS_HOST: ${{ vars.NAS_HOST || '192.168.110.26' }}
          NAS_PORT: ${{ vars.NAS_PORT || '2212' }}
          NAS_USER: ${{ vars.NAS_USER || 'skc' }}
          NAS_PASS: ${{ secrets.NAS_PASS }}
        run: |
          python scripts/deploy_tencent.py
