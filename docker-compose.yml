version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: poe2li-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=poe2li
      - POSTGRES_PASSWORD=poe2li_secret
      - POSTGRES_DB=poe2li
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poe2li -d poe2li"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: poe2li-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: poe2li-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HTTPS_PROXY=http://192.168.110.26:7890
      - HTTP_PROXY=http://192.168.110.26:7890
      - NO_PROXY=api.siliconflow.cn,localhost,127.0.0.1
      - DATABASE_URL=postgresql://poe2li:poe2li_secret@postgres:5432/poe2li
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # LLM — SiliconFlow DeepSeek V3.2 (same provider as embeddings)
      - LLM_BASE_URL=https://api.siliconflow.cn/v1
      - LLM_MODEL=deepseek-ai/DeepSeek-V3.2
      - LLM_API_KEY=${SILICONFLOW_API_KEY}
      # Embedding — SiliconFlow BGE-M3 API (free tier, no GPU needed)
      # Get your API key at: https://cloud.siliconflow.cn
      - EMBEDDING_PROVIDER=api
      - EMBEDDING_BASE_URL=https://api.siliconflow.cn/v1
      - EMBEDDING_API_KEY=${SILICONFLOW_API_KEY}
      - EMBEDDING_API_MODEL=BAAI/bge-m3
      - EMBEDDING_DIM=1024
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: poe2li-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    restart: unless-stopped
    environment:
      - HTTPS_PROXY=http://192.168.110.26:7890
      - HTTP_PROXY=http://192.168.110.26:7890
      - NO_PROXY=api.siliconflow.cn,localhost,127.0.0.1
      - DATABASE_URL=postgresql://poe2li:poe2li_secret@postgres:5432/poe2li
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # LLM — same SiliconFlow config as backend
      - LLM_BASE_URL=https://api.siliconflow.cn/v1
      - LLM_MODEL=deepseek-ai/DeepSeek-V3.2
      - LLM_API_KEY=${SILICONFLOW_API_KEY}
      # Embedding — same SiliconFlow config as backend
      - EMBEDDING_PROVIDER=api
      - EMBEDDING_BASE_URL=https://api.siliconflow.cn/v1
      - EMBEDDING_API_KEY=${SILICONFLOW_API_KEY}
      - EMBEDDING_API_MODEL=BAAI/bge-m3
      - EMBEDDING_DIM=1024
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: poe2li-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://192.168.110.26:8000
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
