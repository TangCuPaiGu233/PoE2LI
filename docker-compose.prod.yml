# Production overrides — apply on top of docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# TODO (Sprint 3): reverse proxy + TLS
# - Add traefik/nginx sidecar or external proxy
# - Let's Encrypt / self-signed cert management
# - Centralize ingress for backend/frontend/langfuse
services:
  postgres:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.5"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poe2li -d poe2li"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
        reservations:
          cpus: "0.25"
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536m
        reservations:
          cpus: "0.5"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  celery_worker:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024m
        reservations:
          cpus: "0.5"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery_beat:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.25"
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery beat' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m
        reservations:
          cpus: "0.25"
          memory: 192m
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  langfuse:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
        reservations:
          cpus: "0.5"
          memory: 384m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  langfuse-clickhouse:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024m
        reservations:
          cpus: "0.5"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client -u langfuse --password langfuse_secret -q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
